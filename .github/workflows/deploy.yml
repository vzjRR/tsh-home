name: Deploy tsh87.com

on:
  push:
    branches: [claude/tsh87-portfolio-rebuild-cgwzdh]
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

concurrency:
  group: deploy-tsh-home
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Deploy the Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_TOKEN }}
