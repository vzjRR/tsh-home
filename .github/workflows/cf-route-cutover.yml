name: Cloudflare route cutover (manual, one-off)

on:
  workflow_dispatch:
    inputs:
      action:
        description: What to do
        required: true
        type: choice
        options:
          - inspect
          - add-med-subdomain
          - cutover-apex
          - verify
        default: inspect

jobs:
  cutover:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CF_TOKEN }}
    steps:
      - name: Check the secret is present
        if: ${{ inputs.action != 'verify' }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "secrets.CF_TOKEN is not set. Add it under Settings > Secrets and variables > Actions, then re-run."
            exit 1
          fi

      - name: Resolve zone and account id for tsh87.com
        if: ${{ inputs.action != 'verify' }}
        run: |
          set -euo pipefail
          ZONE_JSON=$(curl -sS -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/zones?name=tsh87.com")
          echo "$ZONE_JSON" | jq -e '.success == true' > /dev/null || { echo "Zone lookup failed"; echo "$ZONE_JSON"; exit 1; }
          ZONE_ID=$(echo "$ZONE_JSON" | jq -r '.result[0].id')
          ACCOUNT_ID=$(echo "$ZONE_JSON" | jq -r '.result[0].account.id')
          if [ -z "$ZONE_ID" ] || [ "$ZONE_ID" = "null" ]; then echo "No zone found for tsh87.com"; exit 1; fi
          echo "ZONE_ID=$ZONE_ID" >> "$GITHUB_ENV"
          echo "ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"
          echo "Zone and account id resolved (not printed)."

      - name: List Routes, Workers Custom Domains, and Pages projects
        if: ${{ inputs.action == 'inspect' }}
        run: |
          set -euo pipefail

          echo "== Classic Workers Routes on the zone =="
          curl -sS -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/workers/routes" | jq '.result'
          echo

          echo "== Workers Custom Domains on the account, filtered to this zone =="
          curl -sS -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/domains?zone_id=$ZONE_ID" \
            | jq '.result'
          echo

          echo "== DNS records on the zone =="
          curl -sS -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?per_page=100" \
            | jq '[.result[] | {type, name, content, proxied}]'
          echo

          echo "== Pages projects on the account =="
          PAGES_JSON=$(curl -sS -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/pages/projects")
          if echo "$PAGES_JSON" | jq -e '.success == true' > /dev/null 2>&1; then
            echo "$PAGES_JSON" | jq '[.result[] | {name, domains, production_branch}]'
          else
            echo "Pages API call did not succeed. Raw response:"
            echo "$PAGES_JSON" | jq '.' 2>/dev/null || echo "$PAGES_JSON"
          fi

      - name: Create med.tsh87.com pointing at the existing Pages project
        if: ${{ inputs.action == 'add-med-subdomain' }}
        run: |
          set -euo pipefail

          EXISTING=$(curl -sS -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?type=CNAME&name=med.tsh87.com")
          echo "$EXISTING" | jq -e '.success == true' > /dev/null || { echo "DNS lookup failed"; echo "$EXISTING"; exit 1; }

          EXISTING_ID=$(echo "$EXISTING" | jq -r '.result[0].id // empty')
          if [ -n "$EXISTING_ID" ]; then
            echo "med.tsh87.com already exists (record $EXISTING_ID):"
            echo "$EXISTING" | jq '.result[0]'
          else
            echo "Creating med.tsh87.com -> tsh-5hp.pages.dev (proxied)"
            CREATE=$(curl -sS -X POST -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records" \
              --data '{"type":"CNAME","name":"med.tsh87.com","content":"tsh-5hp.pages.dev","proxied":true}')
            echo "$CREATE" | jq '.'
            echo "$CREATE" | jq -e '.success == true' > /dev/null || { echo "Create failed"; exit 1; }
            echo "Created."
          fi

          echo
          echo "== Verifying med.tsh87.com resolves and serves /medical =="
          sleep 5
          dig +short med.tsh87.com CNAME || true
          curl -sS -D - -o /tmp/med.html "https://med.tsh87.com/medical" | grep -iE '^(HTTP|server|cf-ray|location):' || true
          head -c 300 /tmp/med.html; echo

      - name: Repoint tsh87.com and www.tsh87.com at the tsh-home Worker
        if: ${{ inputs.action == 'cutover-apex' }}
        run: |
          set -euo pipefail

          for HOST in tsh87.com www.tsh87.com; do
            echo "== Binding $HOST as a Workers Custom Domain to tsh-home =="
            RESULT=$(curl -sS -X PUT -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/domains" \
              --data "{\"hostname\":\"$HOST\",\"zone_id\":\"$ZONE_ID\",\"service\":\"tsh-home\",\"environment\":\"production\"}")
            echo "$RESULT" | jq '.'
            echo "$RESULT" | jq -e '.success == true' > /dev/null || { echo "Binding $HOST failed"; exit 1; }
          done

          echo
          echo "== Verifying =="
          sleep 8
          curl -sS -D - -o /tmp/root.html "https://tsh87.com/" | grep -iE '^(HTTP|server|cf-ray|location):' || true
          head -c 300 /tmp/root.html; echo
          curl -sS -D - -o /tmp/medical-redirect.html "https://tsh87.com/medical" | grep -iE '^(HTTP|server|location):' || true

      - name: Verify the live domain
        if: ${{ inputs.action == 'verify' }}
        run: |
          set -euo pipefail

          echo "== DNS resolution =="
          for HOST in tsh87.com www.tsh87.com med.tsh87.com; do
            echo "$HOST:"
            dig +short "$HOST" A
            dig +short "$HOST" AAAA
            dig +short "$HOST" CNAME
          done
          echo

          echo "== https://tsh87.com/ =="
          curl -sS -D - -o /tmp/root.html https://tsh87.com/ | grep -iE '^(HTTP|server|cf-ray|cf-cache-status|x-powered-by|via|location):' || true
          head -c 300 /tmp/root.html; echo
          echo

          echo "== https://tsh87.com/medical (should 301 to med.tsh87.com) =="
          curl -sS -D - -o /tmp/medical.html https://tsh87.com/medical | grep -iE '^(HTTP|server|location):' || true
          head -c 300 /tmp/medical.html; echo
          echo

          echo "== https://med.tsh87.com/medical =="
          curl -sS -D - -o /tmp/med.html https://med.tsh87.com/medical | grep -iE '^(HTTP|server|cf-ray|location):' || true
          head -c 300 /tmp/med.html; echo
