name: Cloudflare route cutover (manual, one-off)

on:
  workflow_dispatch:
    inputs:
      action:
        description: What to do
        required: true
        type: choice
        options:
          - inspect
          - narrow-existing-to-medical
          - verify
        default: inspect

jobs:
  cutover:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CF_TOKEN }}
    steps:
      - name: Check the secret is present
        if: ${{ inputs.action != 'verify' }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "secrets.CF_TOKEN is not set. Add it under Settings > Secrets and variables > Actions, then re-run."
            exit 1
          fi

      - name: Resolve zone and account id for tsh87.com
        if: ${{ inputs.action != 'verify' }}
        run: |
          set -euo pipefail
          ZONE_JSON=$(curl -sS -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/zones?name=tsh87.com")
          echo "$ZONE_JSON" | jq -e '.success == true' > /dev/null || { echo "Zone lookup failed"; echo "$ZONE_JSON"; exit 1; }
          ZONE_ID=$(echo "$ZONE_JSON" | jq -r '.result[0].id')
          ACCOUNT_ID=$(echo "$ZONE_JSON" | jq -r '.result[0].account.id')
          if [ -z "$ZONE_ID" ] || [ "$ZONE_ID" = "null" ]; then echo "No zone found for tsh87.com"; exit 1; fi
          echo "ZONE_ID=$ZONE_ID" >> "$GITHUB_ENV"
          echo "ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"
          echo "Zone and account id resolved (not printed)."

      - name: List Routes, Workers Custom Domains, and Pages projects
        if: ${{ inputs.action == 'inspect' }}
        run: |
          set -euo pipefail

          echo "== Classic Workers Routes on the zone =="
          curl -sS -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/workers/routes" | jq '.result'
          echo

          echo "== Workers Custom Domains on the account, filtered to this zone =="
          curl -sS -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/domains?zone_id=$ZONE_ID" \
            | jq '.result'
          echo

          echo "== Pages projects on the account =="
          PAGES_JSON=$(curl -sS -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/pages/projects?per_page=50")
          if echo "$PAGES_JSON" | jq -e '.success == true' > /dev/null 2>&1; then
            echo "$PAGES_JSON" | jq '[.result[] | {name, domains}]'
          else
            echo "Pages API call did not succeed — likely the token has no Pages permission. Raw response:"
            echo "$PAGES_JSON" | jq '.' 2>/dev/null || echo "$PAGES_JSON"
          fi

      - name: Narrow the existing tsh87 worker's route to /medical*
        if: ${{ inputs.action == 'narrow-existing-to-medical' }}
        run: |
          set -euo pipefail
          ROUTES_JSON=$(curl -sS -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/workers/routes")
          echo "$ROUTES_JSON" | jq -e '.success == true' > /dev/null || { echo "Route list failed"; echo "$ROUTES_JSON"; exit 1; }

          ROUTE_ID=$(echo "$ROUTES_JSON" | jq -r '[.result[] | select(.script=="tsh87")][0].id // empty')
          OLD_PATTERN=$(echo "$ROUTES_JSON" | jq -r '[.result[] | select(.script=="tsh87")][0].pattern // empty')

          if [ -z "$ROUTE_ID" ]; then
            echo "No route bound to script 'tsh87' was found. Making no change. Existing routes:"
            echo "$ROUTES_JSON" | jq '.result'
            exit 1
          fi

          echo "Found route $ROUTE_ID currently: '$OLD_PATTERN' -> tsh87"
          echo "Updating its pattern to tsh87.com/medical*"

          UPDATE_JSON=$(curl -sS -X PUT -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/workers/routes/$ROUTE_ID" \
            --data '{"pattern":"tsh87.com/medical*","script":"tsh87"}')

          echo "$UPDATE_JSON" | jq '.'
          echo "$UPDATE_JSON" | jq -e '.success == true' > /dev/null || { echo "Update failed"; exit 1; }
          echo "Route narrowed successfully: tsh87 now serves tsh87.com/medical* only."

      - name: Verify the live domain
        if: ${{ inputs.action == 'verify' }}
        run: |
          set -euo pipefail
          echo "GET https://tsh87.com/"
          curl -sS -o /tmp/root.html -w "  http_code=%{http_code}\n" https://tsh87.com/
          echo "  first 300 chars:"
          head -c 300 /tmp/root.html; echo
          echo
          echo "GET https://tsh87.com/medical"
          curl -sS -o /tmp/medical.html -w "  http_code=%{http_code}\n" https://tsh87.com/medical
          echo "  first 300 chars:"
          head -c 300 /tmp/medical.html; echo
