# Cloudflare Worker configuration for tsh87.com — the personal site.
#
# This Worker serves the built portfolio (dist/) from the ASSETS binding and
# handles the two form endpoints (/api/contact, /api/subscribe) itself, against
# the D1 database bound as DB. It has nothing to do with any other project on
# the account.
#
# tsh87.com and www.tsh87.com reach this Worker through Workers Custom Domains
# bound in the Cloudflare dashboard (Workers & Pages > tsh-home > Settings >
# Domains & Routes), not through a `routes` entry here.
#
# IMPORTANT: `name` below must stay "tsh-home". "tsh87" is a different, older
# Worker on the account - deploying under that name would overwrite it.

name = "tsh-home"
compatibility_date = "2026-09-01"
main = "worker/index.ts"
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
# Run the Worker's fetch() before the assets store for every request, so the
# form endpoints (/api/*) and the /medical redirect are never short-circuited
# by the static handler. The Worker calls env.ASSETS.fetch() itself for
# everything else.
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "tsh87-site"
database_id = "5251f4ab-d9ef-4212-b9df-53d0791badba"
