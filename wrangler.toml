# Cloudflare Worker configuration.
#
# Deployment plan for tsh87.com:
#
#   - tsh87.com / www.tsh87.com currently resolve to a Cloudflare Pages
#     project (a plain proxied CNAME, not a Workers Route or Custom Domain)
#     that serves both the old placeholder homepage and /medical.
#   - Al Ghafri Medical Solutions is staying on its current build (the "tsh"
#     Pages project's /medical route) but appears at med.tsh87.com's root.
#     This Worker answers med.tsh87.com too (a second Workers Custom Domain
#     hostname) and proxies "/" there to "/medical" on that Pages project.
#   - tsh87.com / www.tsh87.com then get repointed at this Worker via a
#     Workers Custom Domain (not a Route - there was never an existing Route
#     to split by path, so that earlier plan didn't apply).
#   - worker/index.ts 301s any /medical* request it still receives (old
#     bookmarks/links), prefix stripped, to med.tsh87.com.
#
# See README.md § Deployment for the exact, ordered steps.
#
# IMPORTANT: `name` below must stay different from the existing production
# Worker's name ("tsh87") - deploying under the same name overwrites it.

name = "tsh-home"
compatibility_date = "2026-09-01"
main = "worker/index.ts"

[assets]
directory = "./dist"
binding = "ASSETS"
# Without this, Cloudflare serves any request matching a static file straight
# from the assets store, bypassing fetch() entirely - which would make "/"
# always resolve to the portfolio's index.html regardless of hostname,
# breaking the med.tsh87.com proxy above. Forcing the Worker to run first
# means every request is decided by fetch() below; it calls
# env.ASSETS.fetch() itself once it knows the request is for the portfolio.
run_worker_first = true

# This site reaches tsh87.com through a Workers Custom Domain bound in the
# Cloudflare dashboard (Workers & Pages > tsh-home > Settings > Domains &
# Routes), not through a `routes` entry here - Custom Domains aren't
# configurable from wrangler.toml.

[[d1_databases]]
binding = "DB"
database_name = "tsh87-site"
database_id = "5251f4ab-d9ef-4212-b9df-53d0791badba"
