# Cloudflare Worker configuration.
#
# Deployed as a Worker (not Pages) deliberately: `tsh87.com/medical*` must keep
# running on the existing production Worker unchanged, and splitting one zone
# by path between two Workers needs Cloudflare Routes — Pages custom domains
# cannot be scoped to a path. See README.md § Deployment for the exact,
# ordered steps; the short version is:
#
#   1. On the EXISTING "tsh87" Worker, narrow its route from `tsh87.com/*`
#      to `tsh87.com/medical*`.
#   2. Deploy this Worker (`wrangler deploy`) — it claims `tsh87.com/*` below.
#      Cloudflare resolves `/medical*` to the existing Worker because it is
#      the more specific pattern; every other path falls through to this one.
#
# IMPORTANT: `name` below must stay different from the existing production
# Worker's name ("tsh87") — deploying under the same name overwrites it.

name = "tsh-home"
compatibility_date = "2026-09-01"
main = "worker/index.ts"

[assets]
directory = "./dist"
binding = "ASSETS"

# Uncomment once step 1 above is done on the existing Worker — this is what
# actually puts the site on the domain.
# routes = [
#   { pattern = "tsh87.com/*", zone_name = "tsh87.com" }
# ]

[[d1_databases]]
binding = "DB"
database_name = "tsh87-site"
database_id = "5251f4ab-d9ef-4212-b9df-53d0791badba"
